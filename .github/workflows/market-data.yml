name: Update Market Data
on:
  schedule:
    - cron: '*/5 0-14 * * 1-5'  # 每5分钟，北京时间8:00-22:00（工作日）
    - cron: '*/10 * * * 1-5'     # 其他时间每10分钟
  workflow_dispatch:              # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market data
        run: |
          python3 -c "
          import urllib.request, json, re

          url = 'https://hq.sinajs.cn/list=gb_ixic,s_sh000300,s_sh000001,rt_hkHSI'
          req = urllib.request.Request(url, headers={'Referer': 'https://finance.sina.com.cn'})
          with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read().decode('gbk')

          result = {}
          for line in data.strip().split('\n'):
              m = re.match(r'var hq_str_(\w+)=\"(.+)\"', line)
              if not m: continue
              code, fs = m.group(1), m.group(2).split(',')
              if len(fs) < 4: continue

              key_map = {'gb_ixic': 'nasdaq', 's_sh000300': 'hs300', 's_sh000001': 'sh', 'rt_hkHSI': 'hsi'}
              key = key_map.get(code)
              if not key: continue

              p = c = cp = None
              if code.startswith('gb_'):
                  p = float(fs[1]); cp = float(fs[2]); c = float(fs[4])
              elif code.startswith('s_sh'):
                  p = float(fs[1]); c = float(fs[2]); cp = float(fs[3])
              elif code == 'rt_hkHSI':
                  p = float(fs[2]); prev = float(fs[3]); c = p - prev
                  cp = float(fs[8]) if len(fs) > 8 and fs[8] else (round(c/prev*100, 2) if prev else 0)

              if p:
                  result[key] = {'price': round(p,2), 'change': round(c or 0,2), 'changePct': round(cp or 0,2)}

          import os
          os.makedirs('data', exist_ok=True)
          with open('data/market.json', 'w') as f:
              json.dump({'time': __import__('datetime').datetime.now().isoformat(), 'data': result}, f)
          print('Updated:', result)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet || (git commit -m "Update market data" && git push)
