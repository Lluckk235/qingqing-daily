name: 每日热点新闻抓取

on:
  schedule:
    # 北京时间 08:00、12:00、16:00、20:00（UTC+8）
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & sync to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit daily-news.json (optional fallback)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-news.json
          git diff --staged --quiet || git commit -m "📡 更新每日热点新闻 [skip ci]"
          git push
